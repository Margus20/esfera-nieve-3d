<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esfera de Nieve Interactiva</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <h1>Esfera de Nieve Interactiva</h1>
    <p>Sube una foto, limpia la escarcha con el dedo, agita la nieve y comparte tu postal.</p>
  </header>

  <main class="stage">
    <canvas id="globeCanvas" width="640" height="780"></canvas>
  </main>

  <section class="panel">
    <label for="photoInput" class="btn btn-photo">Seleccionar foto personal</label>
    <input type="file" id="photoInput" accept="image/*" />

    <input
      type="text"
      id="dedicationInput"
      maxlength="26"
      placeholder="Escribe tu dedicatoria..."
      value="Felices Fiestas"
    />

    <div class="theme-row" role="group" aria-label="Estilo de la base">
      <button type="button" class="theme-chip active" data-theme="wood">Madera</button>
      <button type="button" class="theme-chip" data-theme="gold">Dorado</button>
      <button type="button" class="theme-chip" data-theme="midnight">Medianoche</button>
    </div>

    <div class="action-grid">
      <button type="button" class="btn btn-shake" id="shakeBtn">Agitar nieve</button>
      <button type="button" class="btn btn-frost" id="frostBtn">Poner escarcha</button>
      <button type="button" class="btn btn-download" id="downloadBtn">Descargar</button>
      <button type="button" class="btn btn-share" id="shareBtn">Compartir</button>
    </div>

    <p class="status" id="statusMsg"></p>
  </section>

  <footer class="footer-note">
    Usa únicamente fotos propias o con permiso para compartir con tus familiares.
  </footer>

  <script src="app.js"></script>
</body
  >
</html>
